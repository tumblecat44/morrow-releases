name: Update website download

on:
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-release-manifest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Check release selection and invalid uploads
        run: node --test scripts/update-release.test.mjs
      - name: Verify releases and generate download information
        run: node scripts/update-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish download information
        run: |
          git add release.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update public download information'
          git push origin HEAD:main
